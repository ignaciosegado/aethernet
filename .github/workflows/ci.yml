name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest
      - name: Verify CLI scripts
        run: |
          python scripts/convert_ntu_viral.py --help
          python scripts/calibrate_split.py --help
          python scripts/coop_ntu_viral.py --help
          python scripts/replay.py --help